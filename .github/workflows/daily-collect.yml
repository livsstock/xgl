name: LIVS-Stock 每日财经采集 v2.0

on:
  schedule:
    # 北京时间 8:00 = UTC 0:00
    - cron: '0 0 * * 1-5'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Checkout data branch
        run: |
          git fetch origin data/daily:data/daily 2>/dev/null || git checkout -b data/daily
          git checkout data/daily

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run collection script
        run: |
          python daily_collect.py

      - name: Commit and push to data/daily
        run: |
          git config user.name "LIVS-Stock-Bot"
          git config user.email "livs-stock@github-actions"
          git add output/ stock.josn
          git diff --staged --quiet || git commit -m "auto: daily finance data $(date +%Y-%m-%d)"
          git push origin data/daily

      - name: Failure alert
        if: failure()
        run: |
          echo "::error::LIVS-Stock daily collection FAILED on $(date +%Y-%m-%d)"
