name: LIVS-Stock 每日财经采集

on:
  schedule:
    # 北京时间 8:00 = UTC 0:00
    - cron: '0 0 * * 1-5'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run collection script
        run: |
          python daily_collect.py

      - name: Commit and push results
        run: |
          git config user.name "LIVS-Stock-Bot"
          git config user.email "livs-stock@github-actions"
          git add output/ stock.josn
          git diff --staged --quiet || git commit -m "auto: daily finance data $(date +%Y-%m-%d)"
          git push
