name: LIVS-Stock 每日财经采集 v2.0

on:
  schedule:
    # 北京时间 8:00 = UTC 0:00
    - cron: '0 0 * * 1-5'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout main (code)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run collection script
        run: |
          python daily_collect.py

      - name: Save output to temp
        run: |
          mkdir -p /tmp/data-output
          cp -r output/* /tmp/data-output/
          cp -f stock.josn /tmp/data-output/ 2>/dev/null || true

      - name: Checkout data/daily branch
        uses: actions/checkout@v4
        with:
          ref: data/daily
          path: data-branch

      - name: Commit and push to data/daily
        run: |
          cd data-branch
          mkdir -p output
          cp -r /tmp/data-output/* output/ 2>/dev/null || true
          cp -f /tmp/data-output/stock.josn . 2>/dev/null || true
          git config user.name "LIVS-Stock-Bot"
          git config user.email "livs-stock@github-actions"
          git add output/ stock.josn
          git diff --staged --quiet || git commit -m "auto: daily finance data $(date +%Y-%m-%d)"
          git push origin data/daily

      - name: Failure alert
        if: failure()
        run: |
          echo "::error::LIVS-Stock daily collection FAILED on $(date +%Y-%m-%d)"
